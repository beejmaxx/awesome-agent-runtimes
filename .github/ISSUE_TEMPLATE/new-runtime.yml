name: Suggest a project
description: Propose an agent-stack project for the core catalog
title: "Add: "
labels: [addition]
body:
  - type: input
    id: repository
    attributes:
      label: Repository
      placeholder: https://github.com/owner/repository
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Proposed layer
      options:
        - Agent cognition — coding harness
        - Agent cognition — construction SDK
        - Agent cognition — realtime voice or multimodal
        - Agent cognition — browser or computer use
        - Agent host or supervisor
        - Durable orchestration
        - Personal agent OS or continuity
        - Execution and isolation
        - Application platform or infrastructure
        - Supporting stack project
    validations:
      required: true
  - type: textarea
    id: runtime-role
    attributes:
      label: What ownership boundary does it implement?
      description: Link to documentation for cognition, supervision, recovery, continuity, serving, or isolation claims.
    validations:
      required: true
  - type: textarea
    id: distinction
    attributes:
      label: What makes it distinct from existing entries?
    validations:
      required: true
  - type: textarea
    id: adoption
    attributes:
      label: Adoption and maintenance evidence
      description: Share releases, users, contributors, or other evidence beyond the raw star count.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: The repository has documentation and an identifiable license.
          required: true
        - label: I have disclosed any affiliation with this project below.
          required: true
  - type: input
    id: affiliation
    attributes:
      label: Affiliation
      placeholder: None, maintainer, employee, user, etc.
