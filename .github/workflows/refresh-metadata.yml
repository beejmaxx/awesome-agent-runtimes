name: Refresh GitHub metadata

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository_owner != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Refresh catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md STACK.md WATCHLIST.md EXCLUSIONS.md TAGS.md llms.txt data/catalog.json data/catalog.csv data/stack-catalog.json data/stack-catalog.csv data/metrics.json data/history.json data/trends.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh GitHub metadata"
          git push
